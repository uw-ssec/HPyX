name: Paperclip Issue Sync

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened, assigned, unassigned]
  pull_request:
    types: [opened, edited, labeled, unlabeled, closed, reopened, ready_for_review, converted_to_draft]

jobs:
  notify-paperclip:
    name: Notify Paperclip
    runs-on: ubuntu-latest
    steps:
      - name: Fire Paperclip webhook
        env:
          PAPERCLIP_WEBHOOK_URL: https://manage.uwssec.org/api/routine-triggers/public/5be6b7c2f903663a20b91e81/fire
          PAPERCLIP_WEBHOOK_SECRET: ${{ secrets.PAPERCLIP_WEBHOOK_SECRET }}
        run: |
          EVENT_TYPE="${{ github.event_name }}"
          ACTION="${{ github.event.action }}"

          if [ "$EVENT_TYPE" = "issues" ]; then
            PAYLOAD=$(jq -n \
              --arg event_type "$EVENT_TYPE" \
              --arg action "$ACTION" \
              --argjson issue '${{ toJSON(github.event.issue) }}' \
              --arg repo '${{ github.repository }}' \
              '{event_type: $event_type, action: $action, issue: $issue, repo: $repo}')
          else
            PAYLOAD=$(jq -n \
              --arg event_type "$EVENT_TYPE" \
              --arg action "$ACTION" \
              --argjson pr '${{ toJSON(github.event.pull_request) }}' \
              --arg repo '${{ github.repository }}' \
              '{event_type: $event_type, action: $action, pull_request: $pr, repo: $repo}')
          fi

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${PAPERCLIP_WEBHOOK_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "${PAPERCLIP_WEBHOOK_URL}")

          echo "Paperclip webhook response: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 400 ]; then
            echo "Webhook call failed with status $HTTP_STATUS"
            exit 1
          fi
